<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kuzatuv — кўриш саҳифаси</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; margin: 0; padding: 16px; }
  h2 { font-size: 18px; margin: 20px 0 8px; }
  .setup { background: #1b1b1b; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
  .setup input { width: 100%; box-sizing: border-box; margin-bottom: 6px; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #000; color: #eee; }
  .setup button { padding: 8px 14px; border-radius: 6px; border: none; background: #0f6e56; color: #fff; }
  .item { background: #1b1b1b; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .item .top { display: flex; justify-content: space-between; font-size: 13px; color: #9ad; }
  .item .body { margin-top: 4px; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .missed { color: #e66; }
  .incoming { color: #6c6; }
  .outgoing { color: #69c; }
  #status { font-size: 13px; color: #888; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="setup" id="setupBox">
  <div>Firebase databaseURL'ни киритинг (бошқа қийматлар керак эмас):</div>
  <input id="databaseURL" placeholder="https://aniq-a29bf-default-rtdb.asia-southeast1.firebasedatabase.app" />
  <button onclick="saveConfigAndStart()">Сақлаш ва бошлаш</button>
</div>

<div id="status"></div>
<h2>Қўнғироқлар</h2>
<div id="calls"></div>
<h2>СМС хабарлар</h2>
<div id="sms"></div>

<script>
function esc(s) {
  const d = document.createElement('div');
  d.textContent = String(s ?? '');
  return d.innerHTML;
}

function fmtDate(ts) {
  const d = new Date(Number(ts));
  return d.toLocaleString('uz-UZ');
}

function typeLabel(t) {
  if (t === 'incoming') return 'Кирган';
  if (t === 'outgoing') return 'Чиққан';
  if (t === 'missed') return "Ўтказиб юборилган";
  return t;
}

function saveConfigAndStart() {
  const url = document.getElementById('databaseURL').value.trim();
  localStorage.setItem('kuzatuv_db_url', url);
  start(url);
}

async function fetchPath(baseUrl, path) {
  const res = await fetch(baseUrl.replace(/\/$/, '') + '/' + path + '.json?ts=' + Date.now());
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (!data) return [];
  return Object.values(data);
}

async function refresh(baseUrl) {
  try {
    const calls = await fetchPath(baseUrl, 'calls');
    calls.sort((a, b) => b.timestamp - a.timestamp);
    document.getElementById('status').textContent = 'Янгиланди: ' + new Date().toLocaleTimeString('uz-UZ') + ' (қўнғироқлар: ' + calls.length + ')';
    const callsHtml = calls.map(r => `
      <div class="item">
        <div class="top">
          <span class="${esc(r.type)}">${esc(typeLabel(r.type))}</span>
          <span>${esc(fmtDate(r.timestamp))}</span>
        </div>
        <div class="body">${esc(r.number)} ${r.duration ? '· ' + esc(r.duration) + ' сония' : ''}</div>
      </div>`).join('');
    document.getElementById('calls').innerHTML = callsHtml || '<div class="item">Ҳозирча маълумот йўқ</div>';

    const sms = await fetchPath(baseUrl, 'sms');
    sms.sort((a, b) => b.timestamp - a.timestamp);
    const smsHtml = sms.map(r => `
      <div class="item">
        <div class="top"><span>${esc(r.sender)}</span><span>${esc(fmtDate(r.timestamp))}</span></div>
        <div class="body">${esc(r.body)}</div>
      </div>`).join('');
    document.getElementById('sms').innerHTML = smsHtml || '<div class="item">Ҳозирча маълумот йўқ</div>';
  } catch (e) {
    document.getElementById('status').textContent = 'Хато: ' + e.message;
  }
}

function start(url) {
  document.getElementById('setupBox').style.display = 'none';
  refresh(url);
  setInterval(() => refresh(url), 4000);
}

const savedUrl = localStorage.getItem('kuzatuv_db_url');
if (savedUrl) {
  document.getElementById('databaseURL').value = savedUrl;
  start(savedUrl);
}
</script>
</body>
</html>
