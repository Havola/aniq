<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kuzatuv — кўриш саҳифаси</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; margin: 0; padding: 16px; }
  h2 { font-size: 18px; margin: 24px 0 8px; }
  h3 { font-size: 15px; margin: 16px 0 6px; color: #aaa; }
  .setup { background: #1b1b1b; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
  .setup input { width: 100%; box-sizing: border-box; margin-bottom: 6px; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #000; color: #eee; }
  .setup button { padding: 8px 14px; border-radius: 6px; border: none; background: #0f6e56; color: #fff; }
  .item { background: #1b1b1b; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .item .top { display: flex; justify-content: space-between; font-size: 13px; color: #9ad; }
  .item .body { margin-top: 4px; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .missed { color: #e66; }
  .incoming { color: #6c6; }
  .outgoing { color: #69c; }
  #status { font-size: 13px; color: #888; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="setup" id="setupBox">
  <div>Firebase databaseURL'ни киритинг:</div>
  <input id="databaseURL" placeholder="https://aniq-a29bf-default-rtdb.asia-southeast1.firebasedatabase.app" />
  <button onclick="saveConfigAndStart()">Сақлаш ва бошлаш</button>
</div>

<div id="status"></div>

<h2>Қўнғироқлар</h2>
<h3>Кирган</h3>
<div id="callsIncoming"></div>
<h3>Чиққан</h3>
<div id="callsOutgoing"></div>
<h3>Ўтказиб юборилган</h3>
<div id="callsMissed"></div>

<h2>СМС хабарлар</h2>
<div id="sms"></div>

<script>
function esc(s) {
  var d = document.createElement('div');
  d.textContent = String(s == null ? '' : s);
  return d.innerHTML;
}

function fmtDate(ts) {
  var d = new Date(Number(ts));
  return d.toLocaleString('uz-UZ');
}

function saveConfigAndStart() {
  var url = document.getElementById('databaseURL').value.trim();
  localStorage.setItem('kuzatuv_db_url', url);
  start(url);
}

function fetchPath(baseUrl, path) {
  var full = baseUrl.replace(/\/$/, '') + '/' + path + '.json?ts=' + Date.now();
  return fetch(full).then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(function (data) {
    if (!data) return [];
    return Object.values(data);
  });
}

function renderCalls(arr, elId, cls) {
  arr.sort(function (a, b) { return b.timestamp - a.timestamp; });
  var html = arr.map(function (r) {
    return '<div class="item">' +
      '<div class="top">' +
        '<span class="' + cls + '">' + esc(r.number) + '</span>' +
        '<span>' + esc(fmtDate(r.timestamp)) + '</span>' +
      '</div>' +
      '<div class="body">' + (r.duration ? esc(r.duration) + ' сония' : '') + '</div>' +
    '</div>';
  }).join('');
  document.getElementById(elId).innerHTML = html || '<div class="item">Йўқ</div>';
}

function refresh(baseUrl) {
  fetchPath(baseUrl, 'calls').then(function (calls) {
    renderCalls(calls.filter(function (c) { return c.type === 'incoming'; }), 'callsIncoming', 'incoming');
    renderCalls(calls.filter(function (c) { return c.type === 'outgoing'; }), 'callsOutgoing', 'outgoing');
    renderCalls(calls.filter(function (c) { return c.type === 'missed'; }), 'callsMissed', 'missed');
  }).catch(function (e) {
    document.getElementById('status').textContent = 'Хато (calls): ' + e.message;
  });

  fetchPath(baseUrl, 'sms').then(function (sms) {
    sms.sort(function (a, b) { return b.timestamp - a.timestamp; });
    var html = sms.map(function (r) {
      return '<div class="item">' +
        '<div class="top"><span>' + esc(r.sender) + '</span><span>' + esc(fmtDate(r.timestamp)) + '</span></div>' +
        '<div class="body">' + esc(r.body) + '</div>' +
      '</div>';
    }).join('');
    document.getElementById('sms').innerHTML = html || '<div class="item">Ҳозирча маълумот йўқ</div>';
    document.getElementById('status').textContent = 'Янгиланди: ' + new Date().toLocaleTimeString('uz-UZ');
  }).catch(function (e) {
    document.getElementById('status').textContent = 'Хато (sms): ' + e.message;
  });
}

function start(url) {
  document.getElementById('setupBox').style.display = 'none';
  refresh(url);
  setInterval(function () { refresh(url); }, 4000);
}

var savedUrl = localStorage.getItem('kuzatuv_db_url');
if (savedUrl) {
  document.getElementById('databaseURL').value = savedUrl;
  start(savedUrl);
}
</script>
</body>
</html>
